apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: kc-01
spec:
  instances: 2
  db:
    vendor: postgres
    host: postgres
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  # stateless keeps only an embedded local cache and moves session/auth state to the
  # database, which is the cloud-native (no external Infinispan) operating mode.
  # client-admin-api:v2 enables the new Admin API v2 so the operator can manage clients
  # declaratively through KeycloakOIDCClient / KeycloakSAMLClient CRs.
  features:
    enabled:
      - stateless
      - client-admin-api:v2
  http:
    httpEnabled: true
  hostname:
    strict: false
  # No ingress controller in kind; reach Keycloak through the operator's Service.
  ingress:
    enabled: false
  bootstrapAdmin:
    user:
      secret: keycloak-admin
    # Service account the operator uses to reach the Admin API v2 for KeycloakOIDCClient
    # reconciliation (client-id/client-secret keys of the same secret).
    service:
      secret: keycloak-admin
