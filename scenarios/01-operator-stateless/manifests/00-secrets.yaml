apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: kc-01
type: Opaque
stringData:
  username: keycloak
  password: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: kc-01
type: Opaque
stringData:
  # bootstrapAdmin.user (console login)
  username: admin
  password: admin
  # bootstrapAdmin.service (the service account the operator uses to reach the Admin API v2
  # for declarative client management)
  client-id: operator-admin
  client-secret: operator-admin-secret
