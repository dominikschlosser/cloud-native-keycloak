apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: kc-03
  labels:
    app: keycloak
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      serviceAccountName: keycloak
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: keycloak
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-cassandra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z cassandra 9042; do echo waiting for cassandra; sleep 3; done"]
      containers:
        - name: keycloak
          image: localhost:5001/cnk-03:dev
          imagePullPolicy: Always
          args:
            - start
            - --features=stateless
            - --spi-datastore--provider=k8store
            - --spi-datastore--cassandra--areas=user,user-session,auth-session,login-failure,single-use-object,revoked-token
            - --features-disabled=organization
            - --spi-connections-jpa-legacy-enabled=false
            - --db=dev-mem
            - --health-enabled=true
            - --metrics-enabled=true
            - --hostname-strict=false
            - --http-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_SPI_DATASTORE__K8STORE__READ_ONLY
              value: "false"
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_CONTACT_POINTS
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PORT
              value: "9042"
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_USERNAME
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PASSWORD
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_LOCAL_DATACENTER
              value: datacenter1
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_KEYSPACE
              value: keycloak
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: JAVA_OPTS_APPEND
              value: "-Dconfig.file=/opt/keycloak/conf/cassandra-driver.conf"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: kc-03
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: management
      port: 9000
      targetPort: 9000
