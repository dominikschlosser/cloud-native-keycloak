        - manage-organizations
        - query-users
        - query-clients
        - query-realms
        - query-groups
        - query-organizations
        - impersonation
      master-realm:
        - create-client
        - view-realm
        - view-users
        - view-clients
        - view-events
        - view-identity-providers
        - view-authorization
        - view-organizations
        - manage-realm
        - manage-users
        - manage-clients
        - manage-events
        - manage-identity-providers
        - manage-authorization
        - manage-organizations
        - query-users
        - query-clients
        - query-realms
        - query-groups
        - query-organizations
        - impersonation
    realm:
      - create-realm
  containerId: master
  description: ${role_admin}
  id: admin
  name: admin
  realm: master
