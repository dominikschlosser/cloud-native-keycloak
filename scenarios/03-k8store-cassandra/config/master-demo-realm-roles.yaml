    k8store.dominikschlosser.github.io/keycloak-version: 26.7.0
    k8store.dominikschlosser.github.io/realm: master
spec:
  composite: true
  composites:
    client:
      demo-realm:
        - create-client
        - view-realm
        - view-users
        - view-clients
