apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: argocd
  labels:
    app: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-server
  template:
    metadata:
      labels:
        app: git-server
    spec:
      containers:
        - name: git-server
          image: localhost:5001/cnk-git-server:dev
          imagePullPolicy: Always
          ports:
            - name: git
              containerPort: 9418
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: argocd
  labels:
    app: git-server
spec:
  selector:
    app: git-server
  ports:
    - name: git
      port: 9418
      targetPort: 9418
