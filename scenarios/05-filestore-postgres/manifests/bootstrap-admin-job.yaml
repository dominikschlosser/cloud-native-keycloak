# The read-only seed already contains the master realm, so KC_BOOTSTRAP_ADMIN (which only
# fires when master is first created) never runs and no admin user exists. This one-shot
# Job seeds an admin user into the database for the pre-existing realm. It runs in its own
# pod so its transient management interface does not collide with the server on 9000.
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-admin
  namespace: kc-05
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: keycloak-bootstrap-admin
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap-admin
          image: localhost:5001/cnk-05:dev
          imagePullPolicy: Always
          args:
            - bootstrap-admin
            - user
            - --username
            - admin
            - --password:env
            - KC_BOOTSTRAP_ADMIN_PASSWORD
            - --no-prompt
            - --optimized
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              value: keycloak
            - name: KC_SPI_MAP_STORAGE__FILE__DIR
              value: /opt/keycloak/seed/filestore
            - name: KC_SPI_DATASTORE__FILE__RESOURCES_VERSION_SEED
              value: cnk-05
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
