# The read-only seed already contains the master realm, so KC_BOOTSTRAP_ADMIN never fires.
# This one-shot Job seeds an admin user (stored in Cassandra) for the pre-existing realm. It
# runs in its own pod so its transient management interface does not collide with the server.
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-admin
  namespace: kc-05
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: keycloak-bootstrap-admin
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-cassandra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z cassandra 9042; do echo waiting for cassandra; sleep 3; done"]
      containers:
        - name: bootstrap-admin
          image: localhost:5001/cnk-05:dev
          imagePullPolicy: Always
          args:
            - bootstrap-admin
            - user
            - --username
            - admin
            - --password:env
            - KC_BOOTSTRAP_ADMIN_PASSWORD
            - --no-prompt
            - --optimized
          env:
            - name: KC_SPI_MAP_STORAGE__FILE__DIR
              value: /opt/keycloak/seed/filestore
            - name: KC_SPI_DATASTORE__FILE__RESOURCES_VERSION_SEED
              value: cnk-05
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_CONTACT_POINTS
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PORT
              value: "9042"
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_USERNAME
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PASSWORD
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_LOCAL_DATACENTER
              value: datacenter1
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_KEYSPACE
              value: keycloak
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: JAVA_OPTS_APPEND
              value: "-Dconfig.file=/opt/keycloak/conf/cassandra-driver.conf"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
