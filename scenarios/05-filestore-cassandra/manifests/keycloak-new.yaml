# New (writable) instance. filestore config is per-pod, so this runs one replica on a
# persistent volume. Users and sessions live in Cassandra, config in the files, so there is
# no relational database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filestore
  namespace: kc-05
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: kc-05
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-cassandra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z cassandra 9042; do echo waiting for cassandra; sleep 3; done"]
      containers:
        - name: keycloak
          image: localhost:5001/cnk-05:dev
          imagePullPolicy: Always
          args:
            - start
            - --features=stateless
            - --spi-datastore--provider=file
            - --spi-datastore--cassandra--areas=user,user-session,auth-session,login-failure,single-use-object,revoked-token
            - --features-disabled=authorization,admin-fine-grained-authz,organization
            - --spi-connections-jpa-legacy-enabled=false
            - --db=dev-mem
            - --health-enabled=true
            - --metrics-enabled=true
            - --hostname-strict=false
            - --http-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_SPI_MAP_STORAGE__FILE__DIR
              value: /opt/keycloak/data/filestore
            - name: KC_SPI_DATASTORE__FILE__RESOURCES_VERSION_SEED
              value: cnk-05
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_CONTACT_POINTS
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PORT
              value: "9042"
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_USERNAME
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PASSWORD
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_LOCAL_DATACENTER
              value: datacenter1
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_KEYSPACE
              value: keycloak
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: JAVA_OPTS_APPEND
              value: "-Dconfig.file=/opt/keycloak/conf/cassandra-driver.conf"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: filestore
              mountPath: /opt/keycloak/data/filestore
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore
