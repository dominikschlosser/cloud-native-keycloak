apiVersion: k8store.dominikschlosser.github.io/v1alpha1
kind: KeycloakClient
metadata:
  name: demo.account
  labels:
    k8store.dominikschlosser.github.io/keycloak-version: 26.7.0
    k8store.dominikschlosser.github.io/realm: demo
spec:
  alwaysDisplayInConsole: false
  attributes:
    post.logout.redirect.uris: +
  baseUrl: /realms/demo/account/
  clientAuthenticatorType: client-secret
  clientId: account
  defaultClientScopes:
    - web-origins
    - acr
    - profile
    - roles
    - basic
    - email
  enabled: true
  fullScopeAllowed: false
  id: account
  name: ${client_account}
  optionalClientScopes:
    - address
    - phone
    - offline_access
    - microprofile-jwt
  protocol: openid-connect
  publicClient: true
  realm: demo
  redirectUris:
    - /realms/demo/account/*
  rootUrl: ${authBaseUrl}
  standardFlowEnabled: true
---
apiVersion: k8store.dominikschlosser.github.io/v1alpha1
kind: KeycloakClient
metadata:
  name: demo.account-console
  labels:
    k8store.dominikschlosser.github.io/keycloak-version: 26.7.0
    k8store.dominikschlosser.github.io/realm: demo
spec:
  alwaysDisplayInConsole: false
  attributes:
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: +
  baseUrl: /realms/demo/account/
  clientAuthenticatorType: client-secret
  clientId: account-console
  clientScopeMappings:
    account:
      - manage-account
      - view-groups
  defaultClientScopes:
    - web-origins
    - acr
    - profile
    - roles
    - basic
    - email
  directAccessGrantsEnabled: false
  enabled: true
  fullScopeAllowed: false
  id: account-console
  name: ${client_account-console}
  optionalClientScopes:
    - address
    - phone
    - offline_access
    - microprofile-jwt
  protocol: openid-connect
  protocolMappers:
    - config: {}
      consentRequired: false
      id: b3296261-9368-4298-9345-1d8d78f5c13d
      name: audience resolve
      protocol: openid-connect
      protocolMapper: oidc-audience-resolve-mapper
  publicClient: true
  realm: demo
  redirectUris:
    - /realms/demo/account/*
  rootUrl: ${authBaseUrl}
  standardFlowEnabled: true
---
apiVersion: k8store.dominikschlosser.github.io/v1alpha1
kind: KeycloakClient
metadata:
  name: demo.admin-cli
