---
apiVersion: k8store.dominikschlosser.github.io/v1alpha1
kind: KeycloakClient
metadata:
  name: demo.security-admin-console
  labels:
    k8store.dominikschlosser.github.io/keycloak-version: 26.7.0
    k8store.dominikschlosser.github.io/realm: demo
spec:
  alwaysDisplayInConsole: false
  attributes:
    client.use.lightweight.access.token.enabled: 'true'
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: +
  baseUrl: /admin/demo/console/
  clientAuthenticatorType: client-secret
  clientId: security-admin-console
  defaultClientScopes:
    - web-origins
    - acr
    - profile
    - roles
    - basic
    - email
  enabled: true
  fullScopeAllowed: true
  id: security-admin-console
  name: ${client_security-admin-console}
  optionalClientScopes:
    - address
    - phone
    - offline_access
    - microprofile-jwt
  protocol: openid-connect
  protocolMappers:
    - config:
        access.token.claim: 'true'
        claim.name: locale
        id.token.claim: 'true'
        introspection.token.claim: 'true'
        jsonType.label: String
        user.attribute: locale
        userinfo.token.claim: 'true'
      consentRequired: false
      id: 8f2f319c-e813-4b8c-8bf8-8332353661d0
      name: locale
      protocol: openid-connect
      protocolMapper: oidc-usermodel-attribute-mapper
  publicClient: true
  realm: demo
  redirectUris:
    - /admin/demo/console/*
  rootUrl: ${authAdminUrl}
  standardFlowEnabled: true
  webOrigins:
    - +
