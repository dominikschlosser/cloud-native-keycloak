# New (writable) instance. filestore config is per-pod, so this runs a single replica on a
# persistent volume. The volume matters: the master realm (and its role ids) live in the
# files while the admin user and its role mappings live in Postgres, so the files must
# survive restarts to stay consistent with the database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filestore
  namespace: kc-04
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: kc-04
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: localhost:5001/cnk-04:dev
          imagePullPolicy: Always
          args:
            - start
            - --db=postgres
            - --features=stateless
            - --spi-datastore--provider=file
            - --features-disabled=authorization,admin-fine-grained-authz,organization
            - --health-enabled=true
            - --metrics-enabled=true
            - --hostname-strict=false
            - --http-enabled=true
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              value: keycloak
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_SPI_MAP_STORAGE__FILE__DIR
              value: /opt/keycloak/data/filestore
            # filestore owns the deployment state provider even with a database. Without a
            # stable seed the theme /resources/{tag}/ cache-buster in the console HTML does
            # not match what it serves, so the admin console assets 404 and never load.
            - name: KC_SPI_DATASTORE__FILE__RESOURCES_VERSION_SEED
              value: cnk-04
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: filestore
              mountPath: /opt/keycloak/data/filestore
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore
