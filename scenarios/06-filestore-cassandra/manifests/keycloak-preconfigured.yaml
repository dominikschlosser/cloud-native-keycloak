# Pre-configured (GitOps) instance. The committed demo config is baked into the image as a
# read-only seed, identical on every pod, so this runs two replicas pinned to separate
# workers. Users and sessions live in Cassandra.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: kc-06
  labels:
    app: keycloak
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: keycloak
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-cassandra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z cassandra 9042; do echo waiting for cassandra; sleep 3; done"]
      containers:
        - name: keycloak
          image: localhost:5001/cnk-06:dev
          imagePullPolicy: Always
          args:
            - start
            - --features=stateless
            - --spi-datastore--provider=file
            - --spi-datastore--cassandra--areas=user,user-session,auth-session,login-failure,single-use-object,revoked-token
            - --features-disabled=authorization,admin-fine-grained-authz,organization
            - --spi-connections-jpa-legacy-enabled=false
            - --db=dev-mem
            - --health-enabled=true
            - --metrics-enabled=true
            - --hostname-strict=false
            - --http-enabled=true
          env:
            - name: KC_SPI_MAP_STORAGE__FILE__DIR
              value: /opt/keycloak/seed/filestore
            - name: KC_SPI_DATASTORE__FILE__RESOURCES_VERSION_SEED
              value: cnk-06
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_CONTACT_POINTS
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PORT
              value: "9042"
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_USERNAME
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_PASSWORD
              value: cassandra
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_LOCAL_DATACENTER
              value: datacenter1
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_KEYSPACE
              value: keycloak
            - name: KC_SPI_CASSANDRA_CONNECTION_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: JAVA_OPTS_APPEND
              value: "-Dconfig.file=/opt/keycloak/conf/cassandra-application.conf"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
