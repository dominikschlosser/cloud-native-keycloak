  defaultDefaultClientScopes:
    - role_list
    - AuthnContextClassRef
    - profile
    - email
    - roles
    - web-origins
    - acr
    - basic
  defaultOptionalClientScopes:
    - offline_access
    - address
    - phone
    - microprofile-jwt
  defaultRole:
