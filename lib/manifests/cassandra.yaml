apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: {{NAMESPACE}}
  labels:
    app: cassandra
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: cassandra
          image: cassandra:5.0
          ports:
            - name: cql
              containerPort: 9042
          env:
            # Single-node dev cluster; the keycloak-cassandra-extension creates the
            # keyspace + schema itself on first boot (replication factor 1).
            - name: CASSANDRA_CLUSTER_NAME
              value: keycloak
            - name: CASSANDRA_DC
              value: datacenter1
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: GossipingPropertyFileSnitch
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 128M
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "cqlsh -e 'describe keyspaces'"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: {{NAMESPACE}}
  labels:
    app: cassandra
spec:
  clusterIP: None
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
